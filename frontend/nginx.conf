# frontend/nginx.conf —— 静态资源 + /api 反向代理
#
# 两个容易踩的点：
# 1) 前端 axios 的 baseURL 是相对路径 /api，生产环境没有 vite 代理，
#    必须由 nginx 反代到 backend，否则所有请求打到静态服务器上 404。
# 2) 生成接口是 SSE（text/event-stream），nginx 默认会缓冲响应，
#    表现为"进度条卡住，等论文全写完才一次性刷出来"。必须关掉 buffering。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 导出 docx/pdf 会走这里，稍微放宽一点
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：不缓冲、不缓存、不压缩，事件才能一条条到浏览器
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # 整篇生成是长请求（评测里最慢一次约 3 分钟），默认 60s 会被掐断
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ---- 静态资源 ----
    # 带 hash 的构建产物可以长缓存；index.html 必须每次校验，否则发版后用户拿到旧壳
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
